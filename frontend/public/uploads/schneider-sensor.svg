<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
      <linearGradient id="grad_schneidersensorsvg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064E3B"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="400" height="300" fill="url(#grad_schneidersensorsvg)"/>
    <rect width="400" height="300" fill="url(#grid)"/>
    
    <!-- Top badge -->
    <rect x="24" y="20" width="150" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
    <text x="34" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">SENSORS & AUTOMATION</text>
    
    <text x="376" y="36" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" letter-spacing="1.5">SCHNEIDER</text>

    <!-- Industrial Graphic -->
    <g>
      <rect x="120" y="115" width="160" height="50" rx="8" fill="#065F46" stroke="#34D399" stroke-width="5"/>
           <rect x="250" y="110" width="30" height="60" rx="4" fill="#10B981"/>
           <path d="M70 140 C 90 120, 90 160, 115 140" stroke="#6EE7B7" stroke-width="5" fill="none"/>
           <circle cx="295" cy="140" r="5" fill="#F87171"/>
    </g>

    <!-- Bottom Specs Strip -->
    <rect x="16" y="232" width="368" height="54" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="30" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">SCHNEIDER PROXIMITY SENSOR</text>
    <text x="30" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">M18 PNP Flush • 8mm Sensing</text>
    <text x="370" y="264" text-anchor="end" font-family="monospace" font-size="11" font-weight="600" fill="#34D399">XS618B1PAL2</text>
