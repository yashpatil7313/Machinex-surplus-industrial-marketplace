version: '3.8'

services:
  machinex-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: machinex_marketplace
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=machinex_production_secret_key_2026
    volumes:
      - machinex_uploads:/app/backend/uploads

volumes:
  machinex_uploads:
