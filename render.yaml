# Render.com Blueprint Specification for MACHINEX (Node Web Service + Free PostgreSQL Database)
databases:
  - name: machinex-postgres
    plan: free
    databaseName: machinex_db
    user: machinex_user

services:
  - type: web
    name: machinex-marketplace
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend install --include=dev && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: machinex-postgres
          property: connectionString
