<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
      <linearGradient id="grad_thkguidewaysvg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="400" height="300" fill="url(#grad_thkguidewaysvg)"/>
    <rect width="400" height="300" fill="url(#grid)"/>
    
    <!-- Top badge -->
    <rect x="24" y="20" width="150" height="24" rx="12" fill="rgba(255,255,255,0.1)"/>
    <text x="34" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">CNC & LINEAR MOTION</text>
    
    <text x="376" y="36" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" letter-spacing="1.5">THK JAPAN</text>

    <!-- Industrial Graphic -->
    <g>
      <rect x="70" y="135" width="260" height="20" rx="4" fill="#475569" stroke="#94A3B8" stroke-width="3"/>
           <rect x="150" y="100" width="100" height="50" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="6"/>
           <circle cx="180" cy="125" r="6" fill="#F59E0B"/>
           <circle cx="220" cy="125" r="6" fill="#F59E0B"/>
    </g>

    <!-- Bottom Specs Strip -->
    <rect x="16" y="232" width="368" height="54" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="30" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">THK LINEAR MOTION GUIDE</text>
    <text x="30" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">HSR25 Rail & Block Set • 1200mm Length</text>
    <text x="370" y="264" text-anchor="end" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">HSR25R2SS+1200L</text>
